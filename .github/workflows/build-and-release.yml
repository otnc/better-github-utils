name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (for example 1.2.3)"
        required: false
        default: ""
      force_release:
        description: "Create a release even when the version is not newer"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply version input
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version format: $VERSION"
            exit 1
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          node scripts/sync-version.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json public/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: bump version to $VERSION"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Build package
        run: npm run build

      - name: Read package metadata
        id: package
        run: |
          node -e 'const fs=require("fs"); const p=require("./package.json"); fs.appendFileSync(process.env.GITHUB_OUTPUT, `name=${p.name}\nversion=${p.version}\n`);'

      - name: Decide whether to release
        id: decision
        env:
          VERSION: ${{ steps.package.outputs.version }}
          FORCE_RELEASE: ${{ inputs.force_release }}
        run: |
          git fetch --tags
          latest_tag=$(git tag --sort=-v:refname | head -n1 || true)
          latest_version="${latest_tag#v}"
          if [ -z "$latest_version" ]; then latest_version="0.0.0"; fi
          if [ "$FORCE_RELEASE" = "true" ]; then
            should_release=true
          elif [ "$latest_version" = "$VERSION" ]; then
            should_release=false
          elif [ "$(printf '%s\n%s\n' "$latest_version" "$VERSION" | sort -V | tail -n1)" = "$VERSION" ]; then
            should_release=true
          else
            should_release=false
          fi
          echo "should_release=$should_release" >> "$GITHUB_OUTPUT"
          echo "latest=$latest_version version=$VERSION release=$should_release"

      - name: Verify package asset
        if: steps.decision.outputs.should_release == 'true'
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          VERSION: ${{ steps.package.outputs.version }}
        run: test -f "dist/${PACKAGE_NAME}-${VERSION}.zip"

      - name: Create tag
        if: steps.decision.outputs.should_release == 'true'
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
          fi

      - name: Create GitHub release
        if: steps.decision.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.package.outputs.version }}
          name: v${{ steps.package.outputs.version }}
          generate_release_notes: true
          files: dist/${{ steps.package.outputs.name }}-${{ steps.package.outputs.version }}.zip
